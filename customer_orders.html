<!-- customer_dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Orders</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h2 {
      color: green;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
    }

    th {
      background-color: #f2f2f2;
    }

    .no-orders {
      color: red;
      font-weight: bold;
    }
    .home-icon {
            position: fixed;
            top: 15px;
            left: 15px;
            background-color: #4CAF50;
            color: white;
            padding: 10px 12px;
            border-radius: 50%;
            font-size: 20px;
            text-decoration: none;
            z-index: 999;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease;
        }

  .home-icon:hover {
    background-color: #388e3c;
  }

.home-button:hover {
  background-color: #388e3c;
}
  </style>
</head>
<body>
  <a href="customers_dashboard.html" class="home-icon" title="Home">
    <i class="fas fa-home"></i>
  </a>

  <h2>🛒 My Orders</h2>
  <div id="ordersContainer"></div>
<script>
const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));
const allOrders = JSON.parse(localStorage.getItem("orders")) || [];

// Check if user is logged in
if (!loggedInUser || loggedInUser.role !== "customer") {
    alert("Please login as a customer to view your orders.");
    window.location.href = "login.html";
} else {
    const customerOrders = allOrders.filter(order => order && order.customerId === loggedInUser.mobile);

    const ordersContainer = document.getElementById("ordersContainer");

    if (customerOrders.length === 0) {
        ordersContainer.innerHTML = `<p class="no-orders">No orders placed yet.</p>`;
    } else {
        let tableHTML = `
        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Price</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
        `;

        customerOrders.forEach(order => {
            tableHTML += `
                <tr>
                    <td>${order.product}</td>
                    <td>${order.quantity}</td>
                    <td>${order.location}</td>
                    <td>${order.status}</td>
                    <td>${order.price}</td>
                    <td>${order.date}</td>
                </tr>
            `;
        });

        tableHTML += `</tbody></table>`;
        ordersContainer.innerHTML = tableHTML;
    }
}
</script>

</body>
</html>
