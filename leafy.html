<!DOCTYPEhtml>
<html>

	<title>Pulses</title>

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
	<a href="products.html" class="home-icon" title="Home">
        <i class="fas fa-home"></i>
      </a>
<div class="vegetables">
	<h1>Leafy Vegetables</h1>
	<div class="shop-container">
			<div class="shop-item">
				<img src="images/palak.jpeg">
				<p>Spinach</p>
				<p>(palak)</p>
				<p class= "price">₹35 per bunch</p>
				<input type="number" class="input-field" id="qty-Spinach" placeholder="Quantity (kg)" min="1" required>
  				<input type="text" class="input-field" id="loc-Spinach" placeholder="Your Location" required>
  				<button class="buy-button" onclick="buyNow('Spinach', 35)">Buy Now</button>
			</div>

				<img src="images/methi.jpeg">

			</div>
			<div class="shop-item">

			</div>

				<img src="images/thotakura.jpeg">
